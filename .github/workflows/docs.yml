name: Documentation
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
defaults:
  run:
    working-directory: docs-site
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `enablement` turns Pages on for the repo the first time this runs, so
      # the deploy does not need a manual visit to Settings -> Pages. Without
      # it the action 404s ("Get Pages site failed") until someone flips the
      # setting by hand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      # `path` is resolved from the repo root — `defaults.run` does not apply to
      # action inputs, only to `run:` steps.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site
      - uses: actions/deploy-pages@v5
        id: deployment
