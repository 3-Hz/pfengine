name: Rust
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `rust-toolchain.toml` pins the channel to stable and lists the wasm
      # target. `targets`/`components` are repeated here so the action installs
      # them up front instead of leaving rustup to fetch them mid-build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The determinism gate: pf_net's SyncTest re-simulates rolled-back frames
      # and fails on any checksum mismatch.
      - run: cargo test --workspace
      # macroquad needs no apt packages here. miniquad opens libX11, libGL and
      # libasound with dlopen at runtime, and its build.rs links a system
      # library only on darwin/ios, so nothing is required to compile. A
      # headless runner never opens a window.
      - run: cargo build -p pf_app --target wasm32-unknown-unknown
