<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pfengine</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121218;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- macroquad's JS glue: provides the sapp_*/gl*/fs_* host functions.
         Vendored from the macroquad 0.4.15 crate (miniquad 0.4.10) — see the
         header of mq_js_bundle.js. It replaced the copy on
         not-fl3.github.io/miniquad-samples, which lags the pinned versions and
         is missing six GL renderbuffer/blit entry points. -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // ggrs pulls js-sys in for wasm32, which leaves imports in modules the
        // glue above does not supply (`__wbindgen_placeholder__`,
        // `__wbindgen_externref_xform__`). They are reached only through the
        // per-peer protocol, and there are no peers yet, so stub them rather
        // than let instantiate() reject the module. This replaces the bundle's
        // env-only stub pass; load() looks the function up by name at call
        // time, so the vendored file is untouched. Unlike the bundle's own
        // stubs, which only warn, these throw: a stubbed import that is
        // reached is a bug to fail on, not a warning to scroll past. Goes
        // away when Phase 3 moves the web build to the wasm-bindgen pipeline.
        add_missing_functions_stabs = function (module) {
            for (const imp of WebAssembly.Module.imports(module)) {
                if (imp.kind !== "function") continue;
                importObject[imp.module] ??= {};
                if (importObject[imp.module][imp.name] !== undefined) continue;
                console.warn("No " + imp.module + "." + imp.name + " in the JS glue; stubbed");
                importObject[imp.module][imp.name] = function () {
                    throw new Error("stubbed import called: " + imp.module + "." + imp.name);
                };
            }
        };
        load("pf_app.wasm"); // place the built wasm next to this file (see README)
    </script>
</body>
</html>
